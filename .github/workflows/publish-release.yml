name: Publish Release

on:
  push:
    branches: [master, beta]
  workflow_dispatch:

concurrency:
  group: publish-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      # Lets npm exchange an OIDC token for a short-lived publish credential,
      # so no long-lived npm token is stored on the repository.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # semantic-release determines the next version from the full tag
          # history, and authenticates its own push rather than reusing the
          # checkout credentials.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer, which is not guaranteed
      # by the npm bundled with the Node 24 runner image.
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - run: npm ci
      - run: npm run lint:ci
      - run: npm run test:ci
      - run: npm run build

      - name: Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
